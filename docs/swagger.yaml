info:
  contact:
    email: g.andrewsameh@gmail.com
    name: Andrew Sameh
    url: https://andrewsam.xyz
  description: This is a API Server.
  title: DockMaster Web API
  version: 0.0.1
paths:
  /addresses:
    post:
      consumes:
      - application/json
      description: Creates a new address in the system
      parameters:
      - description: Address details
        in: body
        name: address
        required: true
        schema:
          $ref: '#/definitions/requests.CreateAddressRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/responses.AddressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      security:
      - ApiKeyAuth: []
      summary: Create address
      tags:
      - Addresses
  /addresses/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves an address by its ID
      parameters:
      - description: Address ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.AddressResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.BaseResponse'
      security:
      - ApiKeyAuth: []
      summary: Get address by ID
      tags:
      - Addresses
    put:
      consumes:
      - application/json
      description: Updates an existing address
      parameters:
      - description: Address ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Address details
        in: body
        name: address
