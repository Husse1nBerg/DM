version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-marina_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
