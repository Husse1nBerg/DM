name: Deploy Go Backend PROD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to ECR
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY_PROD }}:latest
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Deploy to ECS PROD
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_PROD_CLUSTER }} \
            --service ${{ secrets.ECS_PROD_SERVICE }} \
            --force-new-deployment \
            --output json

          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_PROD_CLUSTER }} \
            --services ${{ secrets.ECS_PROD_SERVICE }}


      - name: Notify via Power Automate Flow
        if: always()
        run: |
          # Determine deployment status
          STATUS="✅ SUCCESS"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="❌ FAILED"
          fi

          # Send POST to Power Automate flow with a simple card
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "type": "message",
              "attachments": [
                {
                  "contentType": "application/vnd.microsoft.card.adaptive",
                  "content": {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    "type": "AdaptiveCard",
                    "version": "1.4",
                    "body": [
                      {
                        "type": "TextBlock",
                        "text": "Deployment '"$STATUS"'",
                        "weight": "Bolder",
                        "size": "Medium"
                      },
                      {
                        "type": "TextBlock",
                        "text": "Branch: '"${GITHUB_REF#refs/heads/}"'",
                        "wrap": true
                      },
                      {
                        "type": "TextBlock",
                        "text": "Commit: '"${GITHUB_SHA}"'",
                        "wrap": true
                      },
                      {
                        "type": "TextBlock",
                        "text": "Environment: PROD",
                        "wrap": true
                      },
                      {
                        "type": "TextBlock",
                        "text": "Service: '"${{ secrets.ECS_PROD_SERVICE }}"'",
                        "wrap": true
                      }
                    ]
                  }
                }
              ]
            }' \
            "${{ secrets.POWER_AUTOMATE_URL }}"
