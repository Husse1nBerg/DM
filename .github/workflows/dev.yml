name: Deploy Go Backend DEV

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to ECR
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          
      - name: Deploy to ECS DEV
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_DEV_CLUSTER }} \
            --service ${{ secrets.ECS_DEV_SERVICE }} \
            --force-new-deployment \
            --output json
            
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_DEV_CLUSTER }} \
            --services ${{ secrets.ECS_DEV_SERVICE }}


      - name: Notify via Power Automate Flow
        if: always()   # runs on success or failure
        run: |
          # Determine deployment status
          STATUS="✅ SUCCESS"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="❌ FAILED"
          fi

          # Send POST to Power Automate flow
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "status": "'"$STATUS"'",
              "branch": "'"${GITHUB_REF#refs/heads/}"'",
              "commit": "'"${GITHUB_SHA}"'",
              "environment": "DEV",
              "service": "'"${{ secrets.ECS_DEV_SERVICE }}"'"
            }' \
            "${{ secrets.POWER_AUTOMATE_URL }}"
