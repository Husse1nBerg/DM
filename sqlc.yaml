version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "db"
        sql_package: "pgx/v5"
        out: "internal/db"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # - db_type: "jsonb"
          #   nullable: true
          #   go_type:
          #     import: "encoding/json"
          #     type: "json.RawMessage"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "float64"

          # - db_type: "timestamptz"
          #   go_type: "time.Time"
