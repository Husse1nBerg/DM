version: "3.9"

services:
  db:
    image: postgres:17.0-alpine
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-marina_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  test_db:
    image: postgres:17.0-alpine
    restart: always
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${TEST_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TEST_DB_NAME:-marina_test}
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8.0-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - VALKEY_USERNAME=${REDIS_USERNAME:-}
      - VALKEY_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - valkey_data:/data
    command: >
      sh -c "
        # Create valkey configuration file
        mkdir -p /usr/local/etc/valkey
        
        # Base configuration
        echo 'appendonly yes' > /usr/local/etc/valkey/valkey.conf
        echo 'appendfsync everysec' >> /usr/local/etc/valkey/valkey.conf
        echo 'save 900 1' >> /usr/local/etc/valkey/valkey.conf
        echo 'save 300 10' >> /usr/local/etc/valkey/valkey.conf
        echo 'save 60 10000' >> /usr/local/etc/valkey/valkey.conf
        
        # Configure authentication
        if [ -n \"$${VALKEY_USERNAME}\" ] && [ -n \"$${VALKEY_PASSWORD}\" ]; then
          echo \"ACL configuration with username and password\"
          echo 'aclfile /usr/local/etc/valkey/users.acl' >> /usr/local/etc/valkey/valkey.conf
          
          # Create ACL file with user
          echo \"user default nopass nocommands\" > /usr/local/etc/valkey/users.acl
          echo \"user $${VALKEY_USERNAME} on >$${VALKEY_PASSWORD} ~* &* +@all\" >> /usr/local/etc/valkey/users.acl
          
          valkey-server /usr/local/etc/valkey/valkey.conf
        elif [ -n \"$${VALKEY_PASSWORD}\" ]; then
          echo \"Password-only authentication\"
          echo \"requirepass $${VALKEY_PASSWORD}\" >> /usr/local/etc/valkey/valkey.conf
          valkey-server /usr/local/etc/valkey/valkey.conf
        else
          echo \"No authentication configured\"
          valkey-server /usr/local/etc/valkey/valkey.conf
        fi
      "

volumes:
  postgres_data:
  postgres_test_data:
  valkey_data:
